{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom: 2rem;">Checkout</h2>

<div class="grid" style="grid-template-columns: 2fr 1fr;">
    <div class="card">
        <h3 style="margin-bottom: 1rem;">Order Details</h3>
        <form method="POST">
            <div class="form-group">
                <label>Pickup Time</label>
                <select name="pickup_time" class="form-control" required>
                    <option value="">Select Time</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="12:15 PM">12:15 PM</option>
                    <option value="12:30 PM">12:30 PM</option>
                    <option value="12:45 PM">12:45 PM</option>
                    <option value="1:00 PM">1:00 PM</option>
                    <option value="1:15 PM">1:15 PM</option>
                    <option value="4:00 PM">4:00 PM</option>
                    <option value="4:15 PM">4:15 PM</option>
                    <option value="4:30 PM">4:30 PM</option>
                </select>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <input type="text" class="form-control" value="Cash on Pickup" disabled>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.25rem;">Place Order (₹{{
                    total }})</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 1rem;">Order Summary</h3>
        <ul style="list-style: none; padding: 0;">
            {% for item in cart_items %}
            <li
                style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px dashed #E5E7EB;">
                <span>{{ item.name }} &times; {{ item.quantity }}</span>
                <span>₹{{ item.subtotal }}</span>
            </li>
            {% endfor %}
        </ul>
        <div
            style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.25rem; margin-top: 1rem;">
            <span>Total</span>
            <span>₹{{ total }}</span>
        </div>
    </div>
</div>
{% endblock %}
