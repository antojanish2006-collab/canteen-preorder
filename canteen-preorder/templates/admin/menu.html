{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2>Manage Menu</h2>
    <a href="{{ url_for('admin.add_item') }}" class="btn btn-primary">Add Menu Item</a>
</div>

<div class="card">
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Food Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Availability</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>
                        <div style="display: flex; align-items: center; gap: 1rem;">
                            <img src="{{ item.image }}" alt="{{ item.name }}"
                                style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover;">
                            <strong>{{ item.name }}</strong>
                        </div>
                    </td>
                    <td>{{ item.category }}</td>
                    <td>₹{{ item.price }}</td>
                    <td>
                        <form action="{{ url_for('admin.toggle_item', item_id=item._id) }}" method="POST">
                            <button type="submit"
                                class="badge {% if item.is_available %}bg-green{% else %}bg-gray{% endif %}"
                                style="border: none; cursor: pointer;">
                                {% if item.is_available %}Available{% else %}Unavailable{% endif %}
                            </button>
                        </form>
                    </td>
                    <td>
                        <div style="display: flex; gap: 0.5rem;">
                            <a href="{{ url_for('admin.edit_item', item_id=item._id) }}" class="btn btn-secondary"
                                style="padding: 0.25rem 0.5rem; font-size: 0.875rem;">Edit</a>
                            <form action="{{ url_for('admin.delete_item', item_id=item._id) }}" method="POST"
                                onsubmit="return confirm('Are you sure you want to delete this item?');">
                                <button type="submit" class="btn btn-danger"
                                    style="padding: 0.25rem 0.5rem; font-size: 0.875rem;">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="text-align: center;">No menu items found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
